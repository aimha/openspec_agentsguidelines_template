# ============================================================
# ROLE: Stack CI of the project: lint, test and build
# DEPENDS ON: package.json scripts lint, test and build (each optional), .nvmrc
# USED BY: GitHub Actions on PRs to main, develop and feature/**, and on pushes to main and develop
# KEY DECISIONS: only the stack lives here; commits, OpenSpec flow, managed files and audit
#   are checked by agent-harness.yml, which the package manages. Each script runs with
#   --if-present, so a new project gets them as soon as it adds them. Actions pinned to SHA
# GOTCHAS: a project with an extra install step (a second lockfile, a package to build
#   first) adds it before Lint
# LAST UPDATED: 2026-10-22 — stack only, the package gates moved to agent-harness.yml
# ============================================================
name: CI

on:
  pull_request:
    branches: [main, develop, 'feature/**']
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm run test --if-present

      - name: Build
        run: npm run build --if-present
